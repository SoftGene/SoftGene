<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub profile banner</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-style: normal; font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@ibm/plex-sans@1.1.0/fonts/complete/woff2/IBMPlexSans-Medium.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@ibm/plex-sans@1.1.0/fonts/complete/woff2/IBMPlexSans-Regular.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@ibm/plex-mono@1/fonts/complete/woff2/IBMPlexMono-Regular.woff2") format("woff2"); }

  html, body { margin: 0; padding: 0; }

  /* Rendered at 1280 x 320 with device scale 2, so the PNG stays sharp in GitHub's ~830 px column.
     Same palette and chart lines as the LinkedIn banner, so the two profiles look like one person. */
  body {
    width: 1280px;
    height: 320px;
    overflow: hidden;
    position: relative;
    background: #102a33;
    border-radius: 14px;
  }

  svg { position: absolute; inset: 0; }

  .text { position: absolute; left: 72px; top: 64px; }

  .name {
    margin: 0;
    font: 500 58px/1.05 "IBM Plex Sans", "Segoe UI", sans-serif;
    letter-spacing: -0.015em;
    color: #eef3f4;
  }

  .role {
    margin: 12px 0 0;
    font: 400 24px/1.3 "IBM Plex Sans", "Segoe UI", sans-serif;
    color: #cfe0e3;
  }

  .stack {
    margin: 18px 0 0;
    font: 400 18px/1.4 "IBM Plex Mono", Consolas, monospace;
    color: #8fb3bb;
  }
</style>
</head>
<body>

  <!-- ServerMonitor-style readings: CPU in front, memory behind. -->
  <svg width="1280" height="320" viewBox="0 0 1280 320" aria-hidden="true">
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <line x1="0" y1="80" x2="1280" y2="80" />
      <line x1="0" y1="160" x2="1280" y2="160" />
      <line x1="0" y1="240" x2="1280" y2="240" />
    </g>
    <polyline fill="none" stroke="#8fb3bb" stroke-opacity="0.22" stroke-width="2" stroke-linejoin="round"
      points="0,290 64,288 128,291 192,287 256,289 320,285 384,287 448,288 512,290 576,284 640,286 704,289 768,285 832,287 896,282 960,284 1024,288 1088,286 1152,283 1216,287 1280,285" />
    <polyline fill="none" stroke="#4fb3a9" stroke-opacity="0.6" stroke-width="2.5" stroke-linejoin="round"
      points="0,262 64,254 128,266 192,247 256,258 320,234 384,246 448,241 512,259 576,226 640,239 704,252 768,231 832,244 896,215 960,230 1024,250 1088,237 1152,222 1216,242 1280,233" />
  </svg>

  <div class="text">
    <p class="name">Pavel Sakalou</p>
    <p class="role">Junior .NET Developer · Zlín, Czech Republic</p>
    <p class="stack">C# · ASP.NET Core · SQL Server · PostgreSQL · Docker</p>
  </div>

</body>
</html>
