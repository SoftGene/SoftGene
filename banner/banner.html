<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub profile banner — code</title>
<style>
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@ibm/plex-mono@1/fonts/complete/woff2/IBMPlexMono-Regular.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-style: normal; font-display: block;
    src: url("https://cdn.jsdelivr.net/npm/@ibm/plex-mono@1/fonts/complete/woff2/IBMPlexMono-SemiBold.woff2") format("woff2"); }

  html, body { margin: 0; padding: 0; }

  /* 1280 x 320 at device scale 2. A C# snippet in a dark editor: the profile introduces itself in the
     language it is about. Colours follow a restrained dark theme rather than a rainbow of tokens. */
  body {
    width: 1280px;
    height: 320px;
    overflow: hidden;
    background: #0f1419;
    font: 400 25px/1.75 "IBM Plex Mono", Consolas, monospace;
    color: #c9d1d9;
    display: flex;
    align-items: center;
  }

  pre { margin: 0 0 0 76px; font: inherit; white-space: pre; }

  .kw  { color: #ff7b72; }
  .ty  { color: #79c0ff; }
  .str { color: #a5d6ff; }
  .nm  { color: #f0f6fc; font-weight: 600; }
  .cm  { color: #6e7681; }
  .ln  { color: #3d444d; display: inline-block; width: 44px; }
</style>
</head>
<body>
<pre><span class="ln">1</span><span class="cm">// github.com/SoftGene</span>
<span class="ln">2</span><span class="kw">var</span> <span class="nm">pavel</span> = <span class="kw">new</span> <span class="ty">Developer</span>(<span class="str">"SoftGene"</span>)
<span class="ln">3</span>{
<span class="ln">4</span>    Focus = <span class="str">"Backend in C# and .NET"</span>,
<span class="ln">5</span>    Stack = [<span class="str">"ASP.NET Core"</span>, <span class="str">"EF Core"</span>, <span class="str">"SQL Server"</span>, <span class="str">"Docker"</span>],
<span class="ln">6</span>};</pre>
</body>
</html>
