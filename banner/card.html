<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project card</title>
<style>
  html, body { margin: 0; padding: 0; }

  /* 1200 x 750 (16:10), rendered at device scale 2. Every project card uses the same frame and the
     banner's editor colour, so the two cards line up in the README table whatever the screenshot's shape. */
  body {
    width: 1200px;
    height: 750px;
    overflow: hidden;
    background: #0f1419;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 56px;
    box-sizing: border-box;
  }

  .window {
    width: 1088px;
    height: 694px;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
  }

  .window img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
  }
</style>
</head>
<body>
  <div class="window"><img id="shot" alt=""></div>
  <script>
    // ?src=<file URL> picks the screenshot, so one template serves every card;
    // ?pos=<object-position> chooses which part of a wider screenshot stays in frame.
    const params = new URLSearchParams(location.search);
    const shot = document.getElementById("shot");
    shot.src = params.get("src");
    if (params.get("pos")) shot.style.objectPosition = params.get("pos");
  </script>
</body>
</html>
